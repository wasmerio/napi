name: napi-native-concurrency

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/napi-native-concurrency.yml"
      - "Cargo.standalone.lock"
      - "Cargo.standalone.toml"
      - "build.rs"
      - "cargo-standalone.sh"
      - "include/**"
      - "lib/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/foreground_task_waker.rs"
      - "tests/concurrent_*.rs"
      - "tests/guest_*.rs"
      - "tests/wat_guest/**"
      - "v8/**"
  pull_request:
    paths:
      - ".github/workflows/napi-native-concurrency.yml"
      - "Cargo.standalone.lock"
      - "Cargo.standalone.toml"
      - "build.rs"
      - "cargo-standalone.sh"
      - "include/**"
      - "lib/**"
      - "rust-toolchain.toml"
      - "src/**"
      - "tests/foreground_task_waker.rs"
      - "tests/concurrent_*.rs"
      - "tests/guest_*.rs"
      - "tests/wat_guest/**"
      - "v8/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-native-concurrency:
    name: Rust native concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NAPI_WASMER_FORCE_STANDALONE: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang pkg-config libssl-dev

      - name: Cache Rust dependencies and the V8 archive
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-napi-concurrency-rust-1.99-${{ hashFiles('Cargo.standalone.toml', 'Cargo.standalone.lock', 'build.rs', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-napi-concurrency-rust-1.99-

      # WAT guests, each in its own Wasmer store and thread, against the real
      # C++ bridge and V8. No WASIX C toolchain is needed.
      - name: Test concurrent environments and stores, and the foreground task waker
        run: >-
          ./cargo-standalone.sh test --locked
          --test foreground_task_waker
          --test concurrent_envs --test concurrent_stores

      # The library's unit tests, and WAT guests calling the N-API imports:
      # callbacks, guest memory reads and writes, C strings, the memory
      # pressure signal, lazy data properties, and realm snapshots. No WASIX
      # C toolchain is needed either.
      #
      # Not run here: manifest_tests, v8_host_control and v8_worker_threads.
      # They build guests from tests/programs with wasixcc.
      - name: Test the library and the WAT guests
        run: >-
          ./cargo-standalone.sh test --locked --lib
          --test guest_callbacks --test guest_c_strings
          --test guest_memory --test guest_memory_pressure
          --test guest_lazy_properties --test guest_realm_bindings --test guest_owned_objects
