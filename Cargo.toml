[package]
name = "wasmer-napi"
version = "0.705.0"
description = "NAPI library for Wasmer WebAssembly runtime"
edition = "2024"
license = "MIT"
resolver = "2"

[features]
# Host-only native stack validation instrumentation; never enabled by default.
native-stack-diagnostics = []
# Native managed invocation profile; ordinary sys builds remain synchronous.
experimental-async = ["wasmer/experimental-async"]
# Uses the browser/Node JavaScript realm as the N-API value engine when this
# crate is compiled as part of a wasm32-unknown-unknown wasm-bindgen module.
# On native targets this feature is inert and the V8 backend remains active.
js = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "wasmer/experimental-async",
  "wasmer/js-default",
  "wasixv2-exec?/js",
]
# Implements the WASIX v2 runtime's per-instance hook.
wasix = ["experimental-async", "dep:wasixv2-exec", "dep:wasixv2-host", "dep:wasixv2-syscalls"]
cli = [
  "wasix",
  "dep:wasmer-cache",
  "dep:wasmer-c-api-imports",
  "wasmer-c-api-imports/wasixv2",
  "dep:tokio",
  "tokio/signal",
  "dep:wasixv2",
  "wasixv2/terminal",
  "dep:wasixv2-dylink",
  "wasixv2-host/tokio",
  "dep:wasmer-types",
]

[dependencies]
anyhow = "1"
# This manifest is consumed as `wasmer/lib/napi`, so Wasmer dependencies must
# stay relative to that checkout. Standalone builds use Cargo.standalone.toml.
wasmer = { workspace = true, default-features = false }

# This dependencies are ONLY needed for testing napi in Wasm locally
wasmer-cache = { version = "=7.5.0", path = "../cache", optional = true }
wasmer-c-api-imports = { version = "=7.5.0", path = "../c-api-imports", optional = true, default-features = false }
wasmer-types = { workspace = true, default-features = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
wasixv2 = { path = "../wasix/api", optional = true }
wasixv2-dylink = { path = "../wasix/dylink", default-features = false, features = ["sys"], optional = true }
wasixv2-exec = { path = "../wasix/exec", default-features = false, optional = true }
wasixv2-host = { workspace = true, optional = true }
wasixv2-syscalls = { workspace = true, optional = true }
enum-iterator = "2.3.0"
offset-allocator = "0.2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.120", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasixv2-exec = { path = "../wasix/exec", default-features = false, optional = true, features = ["sys"] }
wasmer = { workspace = true, default-features = false, features = [
  "sys-default",
] }

[build-dependencies]
cc = "1"
sha2 = "0.11"
tar = "0.4"
ureq = "2"
xz = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wasixv2 = { path = "../wasix/api" }
wasixv2-host = { workspace = true, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasixv2 = { path = "../wasix/api", default-features = false, features = ["js", "web", "wasix1"] }
wasixv2-host = { workspace = true, features = ["web"] }
wasm-bindgen-test = "0.3.70"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]

[[bin]]
name = "napi_wasmer"
path = "src/bin/napi_wasmer.rs"
required-features = ["cli"]
