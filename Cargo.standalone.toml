[package]
name = "wasmer-napi"
version = "0.701.0"
description = "NAPI library for Wasmer WebAssembly runtime"
edition = "2024"
license = "MIT"
resolver = "2"

[features]
cli = [
  "dep:wasmer-wasix",
  "dep:wasmer-cache",
  "dep:wasmer-compiler-llvm",
  "dep:tokio",
  "dep:virtual-fs",
  "dep:wasmer-types",
]

[dependencies]
anyhow = "1"
# Keep the standalone crates.io build on the 0.701 / 7.1 family. The vendored
# manifest can track local 0.702 / 7.2 path crates, but crates.io 7.2 currently
# requires rustc 1.92 while this standalone workflow is expected to run on 1.91.
wasmer = { version = "=7.1.0" }

# This dependencies are ONLY needed for testing napi in Wasm locally
wasmer-cache = { version = "=7.2.0-alpha.3", optional = true }
wasmer-compiler-llvm = { version = "=7.2.0-alpha.3", optional = true }
wasmer-types = { version = "=7.2.0-alpha.3", optional = true }
wasmer-wasix = { version = "=0.702.0-alpha.3", optional = true }
virtual-fs = { version = "=0.702.0-alpha.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
enum-iterator = "2.3.0"

[build-dependencies]
cc = "1"
tar = "0.4"
ureq = "2"
xz = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = "1"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]

[[bin]]
name = "napi_wasmer"
path = "src/bin/napi_wasmer.rs"
required-features = ["cli"]
