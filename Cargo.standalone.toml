[package]
name = "wasmer-napi"
version = "0.705.0"
description = "NAPI library for Wasmer WebAssembly runtime"
edition = "2024"
license = "MIT"
resolver = "2"

[features]
# Uses the browser/Node JavaScript realm as the N-API value engine when this
# crate is compiled as part of a wasm32-unknown-unknown wasm-bindgen module.
# On native targets this feature is inert and the V8 backend remains active.
js = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "wasmer/experimental-async",
  "wasmer/js-default",
  "wasixv2-exec?/js",
]
# Implements the WASIX v2 runtime's `InstantiationHook` as `NapiHook`.
#
# With tokio: a guest function that JavaScript calls is polled from inside the
# task that runs the guest, where tokio's cooperative budget would stop every
# tokio future after some hundred operations (see `guest/drive.rs`).
wasix = ["dep:wasixv2-exec", "dep:tokio", "tokio/rt"]
cli = [
  "wasix",
  "dep:wasmer-cache",
  "dep:wasmer-c-api-imports-wasixv2",
  "tokio/rt-multi-thread",
  "tokio/signal",
  "tokio/sync",
  "dep:wasixv2",
  "wasixv2/terminal",
  "dep:wasixv2-dylink",
  "dep:wasmer-types",
]

# Compile the standalone CLI with LLVM instead of its default Cranelift backend.
cli-llvm = ["cli", "wasmer/llvm"]

[dependencies]
anyhow = "1"
# The engine is wasmer-runtime and WASIX is wasmer-next's WASIX v2, as in the
# wasmer-next workspace that Cargo.toml builds in. wasmer-next is pinned to one
# revision. Its crates name the engine by this same branch, and a build has
# one engine only if this manifest names it the same way, so the revision of
# the engine is the one Cargo.standalone.lock records.
wasmer = { git = "https://github.com/wasmerio/wasmer-runtime", branch = "refactor/native-async-single-stack", default-features = false }

# This dependencies are ONLY needed for testing napi in Wasm locally
wasmer-cache = { git = "https://github.com/wasmerio/wasmer-next", rev = "bc312beea52570dcacc805bf0c9170d4d5df2470", optional = true }
wasmer-c-api-imports-wasixv2 = { git = "https://github.com/wasmerio/wasmer-next", rev = "bc312beea52570dcacc805bf0c9170d4d5df2470", optional = true, default-features = false, features = [
  "sys",
] }
wasmer-types = { git = "https://github.com/wasmerio/wasmer-runtime", branch = "refactor/native-async-single-stack", optional = true }
wasixv2 = { git = "https://github.com/wasmerio/wasmer-next", rev = "bc312beea52570dcacc805bf0c9170d4d5df2470", optional = true }
wasixv2-dylink = { git = "https://github.com/wasmerio/wasmer-next", rev = "bc312beea52570dcacc805bf0c9170d4d5df2470", default-features = false, features = [
  "sys",
], optional = true }
wasixv2-exec = { git = "https://github.com/wasmerio/wasmer-next", rev = "bc312beea52570dcacc805bf0c9170d4d5df2470", default-features = false, optional = true }
tokio = { version = "1", optional = true }
enum-iterator = "2.3.0"
offset-allocator = "0.2.0"
smallvec = "1.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.120", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A guest callback that V8 calls runs to completion from inside V8's frames,
# which takes the engine's async calls: a WASIX v2 guest's syscalls are async
# imports, and one that has to wait would trap on a synchronous call.
wasmer = { git = "https://github.com/wasmerio/wasmer-runtime", branch = "refactor/native-async-single-stack", default-features = false, features = [
  "sys-default",
  "experimental-async",
] }
wasixv2-exec = { git = "https://github.com/wasmerio/wasmer-next", rev = "bc312beea52570dcacc805bf0c9170d4d5df2470", default-features = false, optional = true, features = [
  "sys",
] }

[build-dependencies]
cc = "1"
tar = "0.4"
ureq = "2"
xz = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]

[[bin]]
name = "napi_wasmer"
path = "src/bin/napi_wasmer.rs"
required-features = ["cli"]

# Keep this manifest independent when cargo-standalone.sh materializes it in a
# temporary directory below a larger checkout that also has a Cargo workspace.
[workspace]
