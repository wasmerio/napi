[package]
name = "wasmer-napi"
version = "0.705.0"
description = "NAPI library for Wasmer WebAssembly runtime"
edition = "2024"
license = "MIT"
resolver = "2"

[features]
js = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "wasmer/experimental-async",
  "wasmer/js-default",
]
# Implements the WASIX runtime's `InstantiationHook` for `NapiRuntimeHooks`.
# `wasmer-wasix` is a non-optional dependency (the always-compiled guest callback
# trampoline needs `WasiError`), so this feature only gates `mod wasix` and does
# not activate the dependency.
wasix = []
cli = [
  "wasix",
  "dep:wasmer-cache",
  "dep:wasmer-c-api-imports",
  "wasmer-c-api-imports/wasi",
  "dep:tokio",
  "dep:virtual-fs",
  "dep:wasmer-types",
]

# Compile the standalone CLI with LLVM instead of its default Cranelift backend.
cli-llvm = ["cli", "wasmer/llvm"]

[dependencies]
anyhow = "1"
# Pin the engine to one immutable wasmer-runtime revision. WASIX, virtual-fs and
# the import bridges live in wasmerio/wasmer, pinned to one immutable revision;
# the [patch] section below builds them against this same engine.
wasmer = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba", default-features = false }

# This dependencies are ONLY needed for testing napi in Wasm locally
wasmer-cache = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba", optional = true }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", rev = "9c594d7b98fe61b1bee8d4ff700b050aede9ffbc", optional = true, default-features = false }
wasmer-types = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba", optional = true }
# Non-optional: `mod guest` (always compiled) re-raises guest WASI process
# exits through the N-API import layers and needs the WASIX error type.
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "9c594d7b98fe61b1bee8d4ff700b050aede9ffbc", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
enum-iterator = "2.3.0"
offset-allocator = "0.2.0"
smallvec = "1.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.120", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "9c594d7b98fe61b1bee8d4ff700b050aede9ffbc", default-features = false, features = [
  "js",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmer = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba", default-features = false, features = [
  "sys-default",
] }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "9c594d7b98fe61b1bee8d4ff700b050aede9ffbc", default-features = false, features = [
  "sys",
] }

[build-dependencies]
cc = "1"
tar = "0.4"
ureq = "2"
xz = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]

[[bin]]
name = "napi_wasmer"
path = "src/bin/napi_wasmer.rs"
required-features = ["cli"]

# wasmerio/wasmer's WASIX crates depend on its engine crates. Redirect those to
# wasmer-runtime so the build contains exactly one engine.
[patch."https://github.com/wasmerio/wasmer.git"]
wasmer = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }
wasmer-cache = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }
wasmer-compiler = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }
wasmer-compiler-cranelift = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }
wasmer-compiler-llvm = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }
wasmer-derive = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }
wasmer-types = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }
wasmer-vm = { git = "https://github.com/wasmerio/wasmer-runtime.git", rev = "c4e5b23a558d3d35a3b92945eba3bc105a37c3ba" }

# Keep this manifest independent when cargo-standalone.sh materializes it in a
# temporary directory below a larger checkout that also has a Cargo workspace.
[workspace]
